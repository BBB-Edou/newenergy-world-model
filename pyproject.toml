[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newenergy-world-model"
version = "0.1.0"
description = "L1-L6 renewable-energy world model: PDF/Markdown, LLM modeling, SysML, WorldModelIR, simulation and CVXPY optimization."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["renewable-energy", "world-model", "sysml", "simulation", "cvxpy", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = ["pymupdf>=1.24", "pydantic>=2.7", "openai>=1.30", "cvxpy>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = [
  "common*",
  "l1_data*",
  "l2_modeling*",
  "l3_sysml*",
  "l4_compiler*",
  "l5_world_model*",
  "scenario_binding*",
  "l6_optimization*",
  "pipelines*",
]
exclude = ["tests*", "examples*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --basetemp=.pytest_tmp"

[project.urls]
Homepage = "https://github.com/BBB-Edou/newenergy-world-model"
Repository = "https://github.com/BBB-Edou/newenergy-world-model"
Issues = "https://github.com/BBB-Edou/newenergy-world-model/issues"
